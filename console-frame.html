<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Developer Console</title>
        <link rel="stylesheet" href="./console.css" />
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #222;
            }

            #consoleLog {
                position: relative;
                inset: auto;
                width: 100%;
                height: 100%;
                min-height: 0;
                max-height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="productionErrorLog"></div>
        <div id="consoleLog"></div>

        <script src="./errorBootstrap.js"></script>

        <script type="module">
            const targetOrigin =
                location.origin === "null" ? "*" : location.origin;

            try {
                const { default: Console } = await import("./Console.js");

                const devConsole = new Console({
                    captureConsole: false,
                    mirrorToNative: false,
                    showCopyButtons: false,
                    allowDragOutsideBounds: false
                });

                const allowedMethods = new Set([
                    "log",
                    "info",
                    "debug",
                    "warn",
                    "error",
                    "group",
                    "groupCollapsed",
                    "groupEnd",
                    "table",
                    "clear"
                ]);

                window.addEventListener("message", event => {
                    if (
                        event.source === window.parent &&
                        event.data?.source === "mobile-dev-console" &&
                        event.data?.type === "console-parent-connected"
                    ) {
                        return;
                    }

                    const { method, args = [] } = event.data;

                    // devConsole.log("[Bridge diagnostic]", method, args);

                    if (!allowedMethods.has(method)) return;

                    if (typeof devConsole[method] === "function") {
                        devConsole[method](...args);
                    } else if (method === "info" || method === "debug") {
                        devConsole.log(...args);
                    }
                });

                window.parent.postMessage(
                    {
                        source: "mobile-dev-console",
                        type: "console-ready"
                    },
                    targetOrigin
                );
            } catch (error) {
                document.getElementById("bridgeStatus").textContent =
                    "Console initialization failed: " + String(error);
            }
        </script>
    </body>
</html>
