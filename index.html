<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>mobile-dev-console</title>
        <link rel="stylesheet" href="./console.css" />
    </head>

    <body>
        <!-- Needed for console elements. -->
        <div id="productionErrorLog"></div>
        <div id="consoleLog"></div>

        <!-- For TestEnvironment / your other scripts -->
        <div id="main" style="flex: 1"></div>

        <!-- Install error listeners first. -->
        <script src="./errorBootstrap.js"></script>

        <!-- Initialize the console before the application. -->
        <script type="module">
            try {
                const { default: Console } = await import("./Console.js");

                new Console();

                // Only load the application after capture is installed.
                // Your first module goes here, for example: await import("./main.js");
                await import("./TestEnvironment.js");
            } catch (error) {
                if (window.devConsole) {
                    window.devConsole.error(error);
                } else {
                    window.showFatalError("Application Startup Failed", error);
                }
            }
        </script>

        <!-- Load your other dependencies here, before main.js imports the application. -->
    </body>
</html>
